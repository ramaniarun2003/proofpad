<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProofPad review recognition</title>

<style>
@font-face{font-family:'Patrick Hand';src:url(fonts/patrick-hand-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:400;font-style:normal;src:url(fonts/stix-two-text-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:400;font-style:italic;src:url(fonts/stix-two-text-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:600;font-style:normal;src:url(fonts/stix-two-text-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:600;font-style:italic;src:url(fonts/stix-two-text-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
</style>
<style>
body{margin:0}
a{color:#5b4b2a}a:hover{color:#2f2610}
</style>

<style>html,body{background:#d9d4c7;margin:0} .wrap{display:flex;justify-content:center;padding:24px} .phone{width:390px;height:844px;flex:none;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}</style>
</head><body><div class="wrap"><div class="phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #2a2419; background-color: #fbf8f1; background-image: linear-gradient(90deg, transparent 47px, #e3a3a3 47px, #e3a3a3 49px, transparent 49px), repeating-linear-gradient(180deg, transparent 0px, transparent 35px, #cfe0f0 35px, #cfe0f0 36px); background-size: 100% 100%, 100% 36px; background-position: 0 0, 0 96px">

  <div style="height: 96px; box-sizing: border-box; padding: 52px 20px 0 60px; display: flex; align-items: baseline; justify-content: space-between; background: #f3ecdc; border-bottom: 1px solid #e2d7c0">
    <div style="font-family: 'Patrick Hand', cursive; font-size: 30px; line-height: 32px; color: #2a2419">Check my reading</div>
    <div style="font-family: 'Patrick Hand', cursive; font-size: 18px; color: #7a6a4a">step 2 of 3</div>
  </div>

  <div style="position: absolute; top: 118px; left: 44px; width: 302px; transform: rotate(-2deg)">
    <div style="position: absolute; top: -12px; left: 110px; width: 80px; height: 24px; background: rgba(255,255,255,0.55); border: 1px solid rgba(0,0,0,0.08); transform: rotate(3deg); z-index: 2"></div>
    <div style="box-sizing: border-box; width: 302px; height: 150px; background: #f1ede4; border: 1px solid #d8d0c0; box-shadow: 2px 4px 10px rgba(60,40,0,0.2); display: flex; align-items: center; justify-content: center; overflow: hidden">
      <svg width="260" height="110" viewBox="0 0 260 110" fill="none" stroke="#2b2b2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="handwritten integral of 2x dx">
        <path d="M66 10c-10 2-12 14-12 28s2 42-4 58c-3 8-12 10-16 4"/>
        <path d="M96 42c0-8 14-10 14-2 0 10-18 16-18 28h20"/>
        <path d="M128 48l16 20M144 48l-16 20"/>
        <path d="M172 54c-8 0-12 14-4 16s12-12 14-16c-2 8-2 16 4 14"/>
        <path d="M212 52l16 18M228 52l-16 18"/>
        <path d="M30 96h200" stroke="#b9c6d6" stroke-width="1" stroke-dasharray="3 5"/>
      </svg>
    </div>
  </div>

  <div style="position: absolute; top: 300px; left: 60px; font-family: 'Patrick Hand', cursive; font-size: 16px; color: #7a6a4a">I read this as</div>
  <div style="position: absolute; top: 322px; left: 60px; right: 24px; display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: 'STIX Two Text', serif; font-size: 30px; line-height: 44px"><span style="font-size: 34px">&#8747;</span> 2<i>x</i> <i>dx</i></div>
    <div style="font-family: 'Patrick Hand', cursive; font-size: 15px; color: #1f7a3a; border: 1.5px solid #1f7a3a; border-radius: 999px; padding: 2px 10px">94% sure</div>
  </div>

  <div style="position: absolute; top: 384px; left: 60px; right: 24px">
    <div style="font-family: 'Patrick Hand', cursive; font-size: 15px; color: #7a6a4a; margin-bottom: 4px">LaTeX, fix it if I got it wrong</div>
    <div style="box-sizing: border-box; height: 44px; padding: 0 12px; border: 1.5px solid #2a2419; border-radius: 8px; background: #fff; font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 44px; color: #2a2419; display: flex; justify-content: space-between; align-items: center">
      <span>\int 2x \, dx</span>
      <span style="width: 2px; height: 22px; background: #2a2419"></span>
    </div>
  </div>

  <div style="position: absolute; top: 468px; left: 60px; right: 24px; display: flex; flex-wrap: wrap; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #c9bda4; border-radius: 8px; background: #f3ecdc">\int</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #c9bda4; border-radius: 8px; background: #f3ecdc">\frac{}{}</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #c9bda4; border-radius: 8px; background: #f3ecdc">^{}</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #c9bda4; border-radius: 8px; background: #f3ecdc">\sqrt{}</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #c9bda4; border-radius: 8px; background: #f3ecdc">\sin</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #c9bda4; border-radius: 8px; background: #f3ecdc">\ln</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #c9bda4; border-radius: 8px; background: #f3ecdc">\sum</span>
  </div>

  <div style="position: absolute; top: 560px; left: 60px; right: 24px">
    <div style="font-family: 'Patrick Hand', cursive; font-size: 15px; color: #7a6a4a; margin-bottom: 6px">What should I do with it?</div>
    <div style="display: flex; gap: 8px">
      <span style="flex: 1; text-align: center; padding: 8px 0; border-radius: 999px; background: #2a2419; color: #fbf8f1; font-family: 'Patrick Hand', cursive; font-size: 17px">Integrate</span>
      <span style="flex: 1; text-align: center; padding: 8px 0; border-radius: 999px; border: 1.5px solid #2a2419; font-family: 'Patrick Hand', cursive; font-size: 17px">Differentiate</span>
      <span style="flex: 1; text-align: center; padding: 8px 0; border-radius: 999px; border: 1.5px solid #2a2419; font-family: 'Patrick Hand', cursive; font-size: 17px">Series</span>
    </div>
  </div>

  <div style="position: absolute; top: 646px; left: 64px; width: 240px; transform: rotate(1deg); background: #fff3a3; box-shadow: 2px 3px 8px rgba(60,40,0,0.18); padding: 10px 12px; font-family: 'Patrick Hand', cursive; font-size: 15px; line-height: 19px; color: #4a3d1e">
    Low confidence? Retake with the page flat and the problem inside the box.
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; box-sizing: border-box; padding: 16px 20px 28px; display: flex; gap: 12px; background: #f3ecdc; border-top: 1px solid #e2d7c0">
    <button style="flex: 1; height: 48px; border: 1.5px solid #2a2419; border-radius: 10px; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #2a2419">Retake</button>
    <button style="flex: 1.4; height: 48px; border: none; border-radius: 10px; background: #2a2419; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #fbf8f1">Looks right, solve it</button>
  </div>
</div>
</div></div></body></html>
