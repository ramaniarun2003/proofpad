<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProofPad results, verified</title>

<style>
@font-face{font-family:'Patrick Hand';src:url(fonts/patrick-hand-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:400;font-style:normal;src:url(fonts/stix-two-text-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:400;font-style:italic;src:url(fonts/stix-two-text-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:600;font-style:normal;src:url(fonts/stix-two-text-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'STIX Two Text';font-weight:600;font-style:italic;src:url(fonts/stix-two-text-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
</style>
<style>
body{margin:0}
a{color:#5b4b2a}a:hover{color:#2f2610}
</style>

<style>html,body{background:#d9d4c7;margin:0} .wrap{display:flex;justify-content:center;padding:24px} .phone{width:390px;height:844px;flex:none;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}</style>
</head><body><div class="wrap"><div class="phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #2a2419; background-color: #fbf8f1; background-image: linear-gradient(90deg, transparent 47px, #e3a3a3 47px, #e3a3a3 49px, transparent 49px), repeating-linear-gradient(180deg, transparent 0px, transparent 35px, #cfe0f0 35px, #cfe0f0 36px); background-size: 100% 100%, 100% 36px; background-position: 0 0, 0 96px">

  <div style="height: 96px; box-sizing: border-box; padding: 52px 20px 0 60px; display: flex; align-items: baseline; justify-content: space-between; background: #f3ecdc; border-bottom: 1px solid #e2d7c0">
    <div style="font-family: 'Patrick Hand', cursive; font-size: 30px; line-height: 32px; color: #2a2419">ProofPad</div>
    <div style="font-family: 'Patrick Hand', cursive; font-size: 18px; color: #7a6a4a">Nov 2 · integral</div>
  </div>

  <div style="position: absolute; top: 112px; right: 22px; transform: rotate(-8deg); font-family: 'Patrick Hand', cursive; font-size: 22px; letter-spacing: 2px; color: #1f7a3a; border: 3px solid #1f7a3a; border-radius: 8px; padding: 2px 10px; opacity: 0.85">VERIFIED</div>

  <div style="position: absolute; top: 108px; left: 60px; font-family: 'Patrick Hand', cursive; font-size: 17px; color: #7a6a4a">Problem</div>
  <div style="position: absolute; top: 132px; left: 60px; font-family: 'STIX Two Text', serif; font-size: 26px; line-height: 36px"><span style="font-size: 30px">&#8747;</span> 2<i>x</i> <i>dx</i></div>

  <div style="position: absolute; top: 204px; left: 0; width: 390px; display: flex; flex-direction: column">

    <div style="height: 72px; display: flex; align-items: flex-end; box-sizing: border-box; padding-bottom: 6px">
      <div style="width: 48px; text-align: center; font-family: 'Patrick Hand', cursive; font-size: 18px; color: #c0504d">1</div>
      <div style="flex: 1; display: flex; flex-direction: column">
        <div style="font-family: 'Patrick Hand', cursive; font-size: 15px; color: #7a6a4a; line-height: 20px">constant multiple</div>
        <div style="font-family: 'STIX Two Text', serif; font-size: 24px; line-height: 36px">2 <span style="font-size: 28px">&#8747;</span> <i>x</i> <i>dx</i></div>
      </div>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1f7a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="step verified" style="margin: 0 18px 6px 0"><path d="M5 13l4 4L19 7"/></svg>
    </div>

    <div style="height: 72px; display: flex; align-items: flex-end; box-sizing: border-box; padding-bottom: 6px">
      <div style="width: 48px; text-align: center; font-family: 'Patrick Hand', cursive; font-size: 18px; color: #c0504d">2</div>
      <div style="flex: 1; display: flex; flex-direction: column">
        <div style="font-family: 'Patrick Hand', cursive; font-size: 15px; color: #7a6a4a; line-height: 20px">power rule</div>
        <div style="font-family: 'STIX Two Text', serif; font-size: 24px; line-height: 36px">2 · <i>x</i><sup style="font-size: 15px">2</sup> / 2</div>
      </div>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1f7a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="step verified" style="margin: 0 18px 6px 0"><path d="M5 13l4 4L19 7"/></svg>
    </div>

    <div style="height: 72px; display: flex; align-items: flex-end; box-sizing: border-box; padding-bottom: 6px">
      <div style="width: 48px; text-align: center; font-family: 'Patrick Hand', cursive; font-size: 18px; color: #c0504d">3</div>
      <div style="flex: 1; display: flex; flex-direction: column">
        <div style="font-family: 'Patrick Hand', cursive; font-size: 15px; color: #7a6a4a; line-height: 20px">simplify</div>
        <div style="font-family: 'STIX Two Text', serif; font-size: 24px; line-height: 36px"><i>x</i><sup style="font-size: 15px">2</sup></div>
      </div>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1f7a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="step verified" style="margin: 0 18px 6px 0"><path d="M5 13l4 4L19 7"/></svg>
    </div>

    <div style="margin: 10px 24px 0 64px; transform: rotate(1.5deg); background: #fff3a3; box-shadow: 2px 3px 8px rgba(60,40,0,0.18); padding: 12px 14px 14px; font-family: 'Patrick Hand', cursive; font-size: 17px; line-height: 22px; color: #4a3d1e">
      <div style="font-size: 14px; color: #8a7a4a; margin-bottom: 2px">why step 2</div>
      <span style="font-family: 'STIX Two Text', serif; font-size: 17px">&#8747; <i>x</i><sup style="font-size: 11px">n</sup> <i>dx</i> = <i>x</i><sup style="font-size: 11px">n+1</sup>/(n+1)</span>, with n = 1. Tap a step to hide this.
    </div>
  </div>

  <div style="position: absolute; top: 536px; left: 0; width: 390px; display: flex; align-items: center">
    <div style="width: 48px; text-align: center; font-family: 'Patrick Hand', cursive; font-size: 16px; color: #7a6a4a; transform: rotate(-90deg); transform-origin: center">answer</div>
    <div style="position: relative; display: inline-block; padding: 10px 26px; border: 2px solid #2a2419; border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; font-family: 'STIX Two Text', serif; font-size: 30px; line-height: 40px"><i>x</i><sup style="font-size: 18px">2</sup> + <i>C</i></div>
  </div>

  <div style="position: absolute; top: 626px; left: 60px; right: 20px; font-family: 'Patrick Hand', cursive; font-size: 16px; color: #7a6a4a; line-height: 20px">checked against SymPy integrate(): agrees at every step</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; box-sizing: border-box; padding: 16px 20px 28px; display: flex; gap: 12px; background: #f3ecdc; border-top: 1px solid #e2d7c0">
    <button style="flex: 1; height: 48px; border: 1.5px solid #2a2419; border-radius: 10px; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #2a2419">Export PDF</button>
    <button style="flex: 1; height: 48px; border: none; border-radius: 10px; background: #2a2419; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #fbf8f1">New problem</button>
  </div>
</div>
</div></div></body></html>
